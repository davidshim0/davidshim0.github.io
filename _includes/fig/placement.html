<svg class="fig" viewBox="0 0 560 190" role="img" aria-label="Two pages touched equally often can perform very differently in the same memory.">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="20" y="24" class="fig-sub" text-anchor="start">two pages, touched equally often</text>
  <g class="fig-box">
    <rect x="20" y="38" width="86" height="40" rx="5"/>
    <text x="63" y="63" class="fig-label">page A</text>
  </g>
  <g class="fig-box">
    <rect x="20" y="108" width="86" height="40" rx="5"/>
    <text x="63" y="133" class="fig-label">page B</text>
  </g>
  <g class="fig-line">
    <path d="M110 58 L250 58" marker-end="url(#ar2)"/>
    <path d="M110 128 L250 128" marker-end="url(#ar2)"/>
  </g>
  <text x="180" y="50" class="fig-tag" text-anchor="middle">100 reads/s</text>
  <text x="180" y="120" class="fig-tag" text-anchor="middle">100 reads/s</text>
  <g class="fig-box is-accent">
    <rect x="256" y="38" width="190" height="40" rx="5"/>
    <text x="351" y="63" class="fig-label">fits: parallel, compressible</text>
  </g>
  <g class="fig-box is-muted">
    <rect x="256" y="108" width="190" height="40" rx="5"/>
    <text x="351" y="133" class="fig-label">does not fit: serialised</text>
  </g>
  <text x="464" y="63" class="fig-tag" text-anchor="start">fast</text>
  <text x="464" y="133" class="fig-tag" text-anchor="start">slow</text>
  <text x="20" y="175" class="fig-sub" text-anchor="start">how often a page is touched does not say which memory suits it</text>
</svg>
