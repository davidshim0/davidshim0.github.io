<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.author.short_name }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.short_name }}</a>
      <nav>
        {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="is-current"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% if page.title and page.show_title != false %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
    {{ content }}
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <span>{{ site.author.name }}</span>
      <span class="sep">·</span>
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      <span class="sep">·</span>
      <a href="https://github.com/{{ site.author.github }}">GitHub</a>
    </div>
  </footer>
</body>
</html>
